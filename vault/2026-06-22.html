    function fromBase64Url(value) {
      const padded = value + "=".repeat((4 - value.length % 4) % 4);
      const binary = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(passphrase, salt, iterations) {
      const encoder = new TextEncoder();
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    function showDocument(documentData) {
      const viewer = document.getElementById("viewer");
      viewer.style.display = "block";
      viewer.srcdoc = documentData.html;
      window.scrollTo({ top: viewer.offsetTop - 12, behavior: "smooth" });
    }

    function renderDocuments(documents) {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      tabs.style.display = "flex";
      documents.forEach((documentData, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = documentData.label;
        button.addEventListener("click", () => {
          for (const child of tabs.children) child.classList.remove("active");
          button.classList.add("active");
          showDocument(documentData);
        });
        tabs.appendChild(button);
        if (index === 0) button.click();
      });
    }

    async function unlock() {
      const passphrase = document.getElementById("passphrase").value;
      if (!passphrase) {
        setStatus("Enter the passphrase first.", true);
        return;
      }
      try {
        setStatus("Decrypting locally...");
        const salt = fromBase64Url(encryptedPayload.salt);
        const iv = fromBase64Url(encryptedPayload.iv);
        const tag = fromBase64Url(encryptedPayload.tag);
        const ciphertext = fromBase64Url(encryptedPayload.ciphertext);
        const sealed = new Uint8Array(ciphertext.length + tag.length);
        sealed.set(ciphertext);
        sealed.set(tag, ciphertext.length);
        const key = await deriveKey(passphrase, salt, encryptedPayload.iterations);
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, sealed);
        const payload = JSON.parse(new TextDecoder().decode(decrypted));
        document.getElementById("unlock-panel").style.display = "none";
        renderDocuments(payload.documents || []);
      } catch (error) {
        setStatus("Could not decrypt. Check the passphrase.", true);
      }
    }

    document.getElementById("unlock").addEventListener("click", unlock);
    document.getElementById("passphrase").addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlock();
    });
    window.addEventListener("load", () => {
      const rawHash = decodeURIComponent(window.location.hash || "").replace(/^#/, "");
      const autoPassphrase = rawHash.startsWith("passphrase=")
        ? rawHash.slice("passphrase=".length)
        : rawHash;
      if (autoPassphrase) {
        document.getElementById("passphrase").value = autoPassphrase;
        unlock();
      }
    });
  </script>
