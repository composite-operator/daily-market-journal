      .label { fill: #293144; font: 800 18px Inter, Arial, sans-serif; }
      .value { fill: #172033; font: 700 17px Inter, Arial, sans-serif; }
      .note { fill: #5c6678; font: 500 15px Inter, Arial, sans-serif; }
