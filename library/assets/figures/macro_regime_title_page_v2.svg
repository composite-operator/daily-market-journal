<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract macro regime title-page artwork</title>
  <desc id="desc">Painterly abstract artwork evoking liquidity, rates, capital flows, credit stress, reflexivity, and regime transitions.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.45" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#fffdfa"/>
    </linearGradient>
    <linearGradient id="rateFault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172033" stop-opacity="0.08"/>
      <stop offset="0.33" stop-color="#172033" stop-opacity="0.72"/>
      <stop offset="0.68" stop-color="#172033" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#172033" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="liquidity" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#0f766e" stop-opacity="0.44"/>
      <stop offset="0.61" stop-color="#2f8f86" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="credit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#b45309" stop-opacity="0.42"/>
      <stop offset="0.75" stop-color="#d7a06c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadowFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#334155" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0"/>
    </linearGradient>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="soften" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1400" height="1900" fill="url(#ground)"/>
  <rect width="1400" height="1900" filter="url(#paperNoise)" opacity="0.72"/>

